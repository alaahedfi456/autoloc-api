$kind: http-request
url: "{{baseUrl}}/api/contrats"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idContrat": 5,
      "dateSignature": "2026-11-02",
      "montantTotal": 480.00,
      "valide": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 400", () => pm.response.to.have.status(400));
      pm.test("Message explicatif", () => {
          pm.expect(pm.response.json().message).to.include("identifiant");
      });
    language: text/javascript
order: 4000
