$kind: http-request
name: Modifier un contrat (montant négatif -> 400)
url: "{{baseUrl}}/api/contrats/{{contratId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dateSignature": "2026-11-02",
      "montantTotal": -50.00,
      "valide": true
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
