$kind: http-request
url: "{{baseUrl}}/api/contrats/{{contratId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dateSignature": "2026-11-02",
      "montantTotal": 520.00,
      "valide": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Montant modifié", () => {
          pm.expect(pm.response.json().montantTotal).to.eql(520.00);
      });
    language: text/javascript
order: 6000
