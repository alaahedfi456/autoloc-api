$kind: http-request
url: "{{baseUrl}}/api/contrats/9999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 404", () => pm.response.to.have.status(404));
      pm.test("Corps d'erreur lisible", () => {
          var json = pm.response.json();
          pm.expect(json.statut).to.eql(404);
          pm.expect(json.message).to.include("Contrat introuvable");
          pm.expect(json.horodatage).to.not.be.empty;
      });
    language: text/javascript
order: 2000
