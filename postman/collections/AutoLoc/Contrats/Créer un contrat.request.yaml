$kind: http-request
url: "{{baseUrl}}/api/contrats"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dateSignature": "2026-11-02",
      "montantTotal": 480.00,
      "valide": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      var json = pm.response.json();
      pm.test("Identifiant généré", () => pm.expect(json.idContrat).to.be.above(0));
      pm.environment.set("contratId", json.idContrat);
    language: text/javascript
order: 3000
