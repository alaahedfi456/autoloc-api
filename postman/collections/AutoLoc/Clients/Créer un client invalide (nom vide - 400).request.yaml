$kind: http-request
name: Créer un client invalide (nom vide -> 400)
url: "{{baseUrl}}/api/clients"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nom": "",
      "prenom": "Ali"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
