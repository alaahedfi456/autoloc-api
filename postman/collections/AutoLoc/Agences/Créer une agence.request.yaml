$kind: http-request
url: "{{baseUrl}}/api/agences"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nom": "Agence Tunis Centre",
      "ville": "Tunis",
      "adresse": "Avenue Habib Bourguiba",
      "telephone": "+21671000111"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
