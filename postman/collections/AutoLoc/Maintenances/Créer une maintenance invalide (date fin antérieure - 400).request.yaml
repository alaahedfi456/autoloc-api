$kind: http-request
name: Créer une maintenance invalide (date fin antérieure -> 400)
url: "{{baseUrl}}/api/maintenances"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dateDebut": "2026-11-05",
      "dateFin": "2026-11-01",
      "description": "Révision freins"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
