$kind: http-request
url: "{{baseUrl}}/api/paiements/9999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 404", () => pm.response.to.have.status(404));
      pm.test("Message de ressource introuvable", () => {
          var json = pm.response.json();
          pm.expect(json.statut).to.eql(404);
          pm.expect(json.message).to.include("Paiement introuvable avec l'identifiant 9999");
      });
    language: text/javascript
order: 2000
