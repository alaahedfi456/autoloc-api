$kind: http-request
name: Créer un équipement invalide (libellé vide -> 400)
url: "{{baseUrl}}/api/equipements"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "libelle": ""
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
