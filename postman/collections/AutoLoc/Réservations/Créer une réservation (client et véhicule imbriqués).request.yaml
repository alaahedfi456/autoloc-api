$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dateDebut": "2026-11-10",
      "dateFin": "2026-11-15",
      "statut": "CONFIRMEE",
      "client": {
        "idClient": 1
      },
      "vehicule": {
        "idVehicule": 1
      }
    }
scripts:
