$kind: http-request
name: Créer un véhicule invalide (tarif journalier négatif -> 400)
url: "{{baseUrl}}/api/vehicules"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "immatriculation": "210-TN-0000",
      "marque": "Volkswagen",
      "modele": "Golf 8",
      "categorie": "BERLINE",
      "tarifJournalier": -50.00,
      "statut": "DISPONIBLE"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
